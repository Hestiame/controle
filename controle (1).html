<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🎲 Controle – Online Dice</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --sky: #5bc8f5;
    --sky-dark: #3aa8d8;
    --gold: #f5c400;
    --gold-dark: #d4a000;
    --gold-outline: #a07000;
    --panel: #d6f0fb;
    --panel-border: #7dd6f5;
    --white: #fff;
    --text-dark: #1a4a6e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    background: var(--sky);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 40px;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(255,255,255,.18) 0 60px, transparent 60px),
      radial-gradient(circle at 80% 70%, rgba(255,255,255,.13) 0 80px, transparent 80px);
    pointer-events: none;
    z-index: 0;
  }

  header {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 32px 20px 8px;
    width: 100%;
  }

  .logo {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(2rem, 8vw, 3rem);
    color: var(--gold);
    text-shadow:
      -2px -2px 0 var(--gold-outline),
       2px -2px 0 var(--gold-outline),
      -2px  2px 0 var(--gold-outline),
       2px  2px 0 var(--gold-outline),
       0    4px 0 var(--gold-dark);
    letter-spacing: 2px;
  }

  .subtitle {
    font-family: 'Fredoka One', cursive;
    color: var(--white);
    font-size: clamp(.85rem, 3vw, 1rem);
    letter-spacing: 3px;
    margin-top: 4px;
    opacity: .9;
  }

  .status-bar {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-top: 10px;
    font-family: 'Fredoka One', cursive;
    font-size: .8rem;
    color: var(--white);
    letter-spacing: 1px;
    opacity: .85;
  }
  .status-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #aaa;
    transition: background .4s;
  }
  .status-dot.connected { background: #2da832; box-shadow: 0 0 8px #2da83288; }
  .status-dot.error     { background: #e63030; }

  /* ── Main panel ── */
  .panel {
    position: relative;
    z-index: 1;
    background: var(--panel);
    border: 4px solid var(--panel-border);
    border-radius: 24px;
    padding: 24px 20px 28px;
    width: min(420px, 94vw);
    margin-top: 20px;
    box-shadow: 0 8px 40px rgba(0,80,160,.18), 0 2px 0 rgba(255,255,255,.6) inset;
  }

  .panel-title {
    font-family: 'Fredoka One', cursive;
    color: var(--text-dark);
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    letter-spacing: 2px;
    text-align: center;
    margin-bottom: 6px;
  }
  .panel-sub {
    font-family: 'Nunito', sans-serif;
    font-size: .78rem;
    color: var(--text-dark);
    text-align: center;
    opacity: .6;
    margin-bottom: 22px;
    letter-spacing: .3px;
  }

  /* ── Swatches ── */
  .swatches {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
  }

  .swatch-card {
    display: flex;
    align-items: center;
    gap: 14px;
    background: var(--white);
    border-radius: 16px;
    padding: 14px 16px;
    cursor: pointer;
    border: 3px solid transparent;
    box-shadow: 0 3px 0 rgba(0,0,0,.10);
    transition: transform .15s, box-shadow .15s, border-color .15s, opacity .2s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .swatch-card:active { transform: scale(.96); }
  .swatch-card.blocked {
    border-color: #e63030;
    opacity: .55;
    background: #fff5f5;
  }
  .swatch-card.blocked .swatch-name { color: #c00; }

  .swatch-circle {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    border: 3px solid rgba(255,255,255,.7);
    box-shadow: 0 3px 0 rgba(0,0,0,.15);
    flex-shrink: 0;
    position: relative;
  }
  .swatch-circle .x-mark {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    font-weight: 900;
    color: #c00;
  }
  .swatch-card.blocked .swatch-circle .x-mark { display: flex; }

  .swatch-info { flex: 1; }
  .swatch-name {
    font-family: 'Fredoka One', cursive;
    font-size: .9rem;
    letter-spacing: 1px;
    color: var(--text-dark);
    display: block;
  }
  .swatch-status {
    font-family: 'Nunito', sans-serif;
    font-size: .7rem;
    font-weight: 700;
    color: #2da832;
    letter-spacing: .5px;
    margin-top: 2px;
  }
  .swatch-card.blocked .swatch-status { color: #c00; }

  /* ── Clear button ── */
  .btn-clear {
    display: block;
    width: 100%;
    margin-top: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 1rem;
    letter-spacing: 2px;
    color: var(--text-dark);
    background: linear-gradient(160deg, #f5c400 0%, #f0a800 100%);
    border: none;
    border-radius: 12px;
    padding: 13px 20px;
    cursor: pointer;
    box-shadow: 0 4px 0 var(--gold-dark);
    transition: transform .12s, box-shadow .12s;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-clear:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--gold-dark); }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(26,74,110,.92);
    color: #fff;
    font-family: 'Fredoka One', cursive;
    font-size: .9rem;
    letter-spacing: 1px;
    padding: 10px 24px;
    border-radius: 40px;
    box-shadow: 0 4px 16px rgba(0,0,0,.2);
    z-index: 999;
    transition: transform .3s cubic-bezier(.36,1.56,.64,1), opacity .3s;
    opacity: 0;
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* loading */
  .loading {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    color: var(--text-dark);
    opacity: .5;
    padding: 20px 0;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<header>
  <div class="logo">🎲 CONTROLE</div>
  <div class="subtitle">ONLINE DICE – REMOTE</div>
  <div class="status-bar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Conectando...</span>
  </div>
</header>

<div class="panel">
  <div class="panel-title">🚫 BLOQUEAR CORES</div>
  <div class="panel-sub">Toque em uma cor para bloquear/desbloquear nos dados do PC</div>
  <div class="swatches" id="swatches">
    <div class="loading">Conectando ao Firebase...</div>
  </div>
  <button class="btn-clear" id="btnClear">🔓 DESBLOQUEAR TUDO</button>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, set, update, onValue, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAGmDWTxfjzg82owcefvei2vdYfz-RVW2E",
    authDomain: "online-5c801.firebaseapp.com",
    databaseURL: "https://online-5c801-default-rtdb.firebaseio.com",
    projectId: "online-5c801",
    storageBucket: "online-5c801.firebasestorage.app",
    messagingSenderId: "785189068072",
    appId: "1:785189068072:web:c9024d78b877110000441d",
  };

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const blockedRef = ref(db, 'blockedColors');

  const ALL_BLOCKABLE = [
    { hex: '#f5b800', name: 'DEAL'       },
    { hex: '#e63030', name: 'L TRADE'    },
    { hex: '#2da832', name: 'FAIR TRADE' },
    { hex: '#8c30cc', name: 'LAST OFFER' },
    { hex: '#f07020', name: 'NO THANKS'  },
    { hex: '#2068d4', name: 'ADD MORE'   },
  ];

  let blockedColors = new Set();
  let firebaseReady = false;

  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
  }

  function buildSwatches() {
    const container = document.getElementById('swatches');
    container.innerHTML = '';
    ALL_BLOCKABLE.forEach(({ hex, name }) => {
      const card = document.createElement('div');
      card.className = 'swatch-card' + (blockedColors.has(hex) ? ' blocked' : '');
      card.dataset.hex = hex;

      const circle = document.createElement('div');
      circle.className = 'swatch-circle';
      circle.style.background = hex;
      const x = document.createElement('div');
      x.className = 'x-mark';
      x.textContent = '✕';
      circle.appendChild(x);

      const info = document.createElement('div');
      info.className = 'swatch-info';
      const nm = document.createElement('span');
      nm.className = 'swatch-name';
      nm.textContent = name;
      const st = document.createElement('span');
      st.className = 'swatch-status';
      st.textContent = blockedColors.has(hex) ? 'BLOQUEADA' : 'ATIVA';
      info.appendChild(nm);
      info.appendChild(st);

      card.appendChild(circle);
      card.appendChild(info);
      container.appendChild(card);

      card.addEventListener('click', async () => {
        if (!firebaseReady) return;
        const safeKey = hex.replace('#', 'c');
        if (blockedColors.has(hex)) {
          // unblock
          await set(ref(db, `blockedColors/${safeKey}`), null);
          showToast(`✅ ${name} desbloqueada`);
        } else {
          // block
          await set(ref(db, `blockedColors/${safeKey}`), true);
          showToast(`🚫 ${name} bloqueada`);
        }
      });
    });
  }

  // Listen to Firebase
  onValue(blockedRef, (snapshot) => {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className  = 'status-dot connected';
    text.textContent = '🖥️ PC conectado';
    firebaseReady = true;

    const data = snapshot.val();
    blockedColors = new Set();
    if (data) {
      Object.keys(data).forEach(key => {
        if (data[key] === true) {
          // convert safeKey back to hex
          const hex = '#' + key.slice(1);
          blockedColors.add(hex);
        }
      });
    }
    buildSwatches();
  }, (error) => {
    const dot  = document.getElementById('statusDot');
    const text = document.getElementById('statusText');
    dot.className  = 'status-dot error';
    text.textContent = '❌ Erro de conexão';
  });

  // Clear all
  document.getElementById('btnClear').addEventListener('click', async () => {
    if (!firebaseReady) return;
    await remove(blockedRef);
    showToast('🔓 Todas desbloqueadas!');
  });
</script>
</body>
</html>
